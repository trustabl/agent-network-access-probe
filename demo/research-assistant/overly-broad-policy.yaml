version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc, /home, /opt]
  read_write: [/sandbox, /tmp, /var/log, /var/data]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  outbound:
    - { host: api.openai.com,    port: 443, protocol: tcp }
    - { host: api.anthropic.com, port: 443, protocol: tcp }
    - { host: api.google.com,    port: 443, protocol: tcp }
    - { host: googleapis.com,    port: 443, protocol: tcp }
    - { host: s3.amazonaws.com,  port: 443, protocol: tcp }
    - { host: api.perplexity.ai, port: 443, protocol: tcp }