# Checks the MCP server in mcp/ on every change to it.
#
# mcp/dist/index.js is committed and is what installs run, so a bundle that does
# not match mcp/server ships the wrong code. The smoke test then starts the
# server over stdio and scans a fixture with the released Probe binary.
name: mcp

on:
  push:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/mcp.yml"]
  pull_request:
    paths: ["mcp/**", ".github/workflows/mcp.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/server/package-lock.json

      - name: Install
        working-directory: mcp/server
        run: npm ci

      - name: Rebuild the bundle
        working-directory: mcp/server
        run: npm run build

      - name: dist/ must match server/
        run: |
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error::mcp/dist/index.js is stale. Run 'npm run build' in mcp/server and commit the result."
            exit 1
          fi

      - name: Smoke test
        env:
          SMOKE_SCAN: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: node test/smoke.mjs

      # The release also ships the server as an MCP Bundle; a manifest that
      # fails validation would only surface at release time otherwise.
      - name: MCP Bundle manifest validates and packs
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "$RUNNER_TEMP/check.mcpb"
