# Builds and publishes Trustabl Probe on a v* tag.
#
# goreleaser produces the archives and checksums, creates the GitHub release,
# and writes the Homebrew formula and Scoop manifest straight into their tap
# repositories. That last part is the point: both taps previously had to be
# updated by hand from build.sh output, which never happened after the
# repository rename, so they pointed at a deleted repository and every install
# failed at the download step.
#
# Runs on ubuntu-latest because the binary is pure Go (CGO_ENABLED=0), so every
# target cross-compiles from one runner with no toolchain.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # OIDC for build provenance
      attestations: write    # persist the provenance attestation itself
    env:
      # npm publishing (below) runs only once this repository has the secret.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # goreleaser needs full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          # A PAT, not GITHUB_TOKEN: the default token cannot write to another
          # repository, and the taps are separate repositories.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.TAP_PAT }}

      # The MCP server (mcp/) ships with each release as its own file, so its
      # installs are counted apart from the binaries. Its version is set to the
      # tag, which makes it run this same release's binary, and the smoke test
      # scans with the binaries goreleaser just published.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pack the MCP server
        working-directory: mcp
        env:
          SMOKE_SCAN: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd server && npm ci && npm run build)
          git diff --exit-code -- dist/index.js
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          node test/smoke.mjs
          cp ../LICENSE .
          npm pack
          f=$(ls trustabl-agent-network-access-probe-*.tgz)
          sha256sum "$f" > "$f.sha256"

          # The same server as an MCP Bundle, for Claude Desktop, the MCP
          # Registry and Smithery. .mcpbignore keeps it to the runtime files.
          v="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version=process.argv[1];fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')" "$v"
          b="trustabl-agent-network-access-probe-$v.mcpb"
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "$b"
          sha256sum "$b" > "$b.sha256"

          # The MCP Registry record for this release, ready for mcp-publisher.
          node -e "const fs=require('fs');const [v,sha]=process.argv.slice(1);const s=JSON.parse(fs.readFileSync('server.json'));s.version=v;const p=s.packages[0];p.version=v;p.identifier='https://github.com/trustabl/agent-network-access-probe/releases/download/v'+v+'/trustabl-agent-network-access-probe-'+v+'.mcpb';p.fileSha256=sha;fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')" "$v" "$(cut -d' ' -f1 "$b.sha256")"

      # With npm, `npx -y @trustabl/agent-network-access-probe` always installs the latest
      # release, and the registry record gains an npm package that every MCP
      # client can install. package.json's mcpName proves registry ownership.
      - name: Publish the MCP server to npm
        if: env.HAS_NPM_TOKEN == 'true'
        working-directory: mcp
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --provenance --access public
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json'));s.packages.unshift({registryType:'npm',identifier:'@trustabl/agent-network-access-probe',version:s.version,transport:{type:'stdio'}});fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"

      - name: Attach the MCP server to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            mcp/trustabl-agent-network-access-probe-*.tgz mcp/trustabl-agent-network-access-probe-*.tgz.sha256 \
            mcp/trustabl-agent-network-access-probe-*.mcpb mcp/trustabl-agent-network-access-probe-*.mcpb.sha256 \
            mcp/server.json

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            mcp/trustabl-agent-network-access-probe-*.tgz
            mcp/trustabl-agent-network-access-probe-*.mcpb
